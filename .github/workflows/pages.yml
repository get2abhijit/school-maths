# Builds and tests the app, then publishes dist/mathe7.html as index.html on GitHub Pages (S12, D99).
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
# Action majors as of 2026 (checkout v6, setup-node v6, configure-pages v6, upload-pages-artifact v5, deploy-pages v5);
# pin them to a commit SHA if you want fully reproducible builds.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Optional test dependencies (jsdom, KaTeX) — tests only, never shipped
        run: npm run test:dev-deps
      - name: Build and test
        run: npm test
      - name: Prepare site
        run: |
          mkdir -p _site
          cp dist/mathe7.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
